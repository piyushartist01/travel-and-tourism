<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your saved travel destinations on TravelGo. View and manage your wishlist.">
    <title>Wishlist - TravelGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="wishlist.css">
</head>

<body>

    <!-- HERO SECTION: Navbar + Title + Search -->

    <header class="hero-section">

        <!-- Navigation Bar -->
        <nav class="dynamic-island">
            <h2><i class="fa-solid fa-plane"></i> TravelGo</h2>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="destination.html">Destinations</a>
                <a href="package.html">Packages</a>
                <a href="wishlist.html" class="active">Wishlist</a>
                <a href="login.html">Profile</a>
            </div>

            <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

        <!-- Wishlist Title -->
        <section class="page-title">
            <h1>My Wishlist <i class="fa-solid fa-heart" style="color: #ff5a5f;"></i> <span id="wishlistCount">0</span></h1>
            <p>Your saved destinations.</p>
        </section>

        <!-- Wishlist Search -->
        <div class="wishlist-search">
            <input
                type="text"
                id="wishlistSearch"
                placeholder="Search your saved destinations..."
                onkeyup="searchWishlist()"
            >
        </div>

    </header>


    <!-- WISHLIST CONTENT -->

    <section class="section">

        <div id="wishlistContainer">
            <p id="emptyMessage">Your wishlist is empty.</p>
        </div>

        <p class="wishpara">
            Explore amazing destinations and save your favourites here.
        </p>

        <a href="destination.html" class="db">
            Explore Destinations
        </a>

    </section>


    <!-- FOOTER -->

    <footer>
        <p>© 2026 TravelGo | Tour &amp; Travel</p>
    </footer>

    <!-- JavaScript -->
    <script src="index.js"></script>
    <script src="wishlist.js"></script>

</body>

</html>
