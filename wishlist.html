
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist - TravelGo</title>
<link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="wishlist.css">
</head>

<body>

    <!-- =========================
         HERO SECTION
         Navbar + Title + Search
    ========================== -->

    <header class="hero-section">

        <!-- Navigation Bar -->

        <nav>

            <h2><i class="fa-solid fa-plane" style="color:rgba(212, 209, 14, 0.9)"></i>TravelGo</h2>

            <div class="nav-links">

        <!-- Wishlist Title -->

        <div class="wishlist-search">
